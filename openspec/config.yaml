schema: spec-driven

context: |
  This project must use the existing free Vercel Hobby plan for its shared relay; do not introduce paid features or alternative hosting providers.
  The browser participant host owns game simulation. The server handles only admission, ordered actions, checkpoints and host election.
  The user's final concept is cooperative descending aliens inspired by Space Invaders, with no asteroid fracture mechanics.
  Each participant has three personal lives across waves, spectates on elimination, and rejoins the shared wave-one replay after team defeat.
  The user has authorized implementation, commits, releases and live-demo publication; preserve unrelated changes and use the default branch.
